[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fifth-pick"
version = "0.1.0"
description = "Human-governed NBA fantasy selection and discipline CLI"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
fifth-pick = "fifth_pick.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.9",
  "ty>=0.0.1a1",
  "types-PyYAML>=6.0",
]
legacy = [
  "mcp<2",
  "pytest>=9",
]

[tool.uv]
default-groups = ["dev", "legacy"]

[tool.hatch.build.targets.wheel]
packages = ["final-project/src/fifth_pick"]

[tool.hatch.build.targets.wheel.force-include]
"final-project/config/fifth-pick/approved-sources.yaml" = "fifth_pick/data/config/approved-sources.yaml"
"final-project/config/fifth-pick/approved-universe.yaml" = "fifth_pick/data/config/approved-universe.yaml"
"final-project/config/fifth-pick/category-map.yaml" = "fifth_pick/data/config/category-map.yaml"
"final-project/config/fifth-pick/governance.yaml" = "fifth_pick/data/config/governance.yaml"
"final-project/config/fifth-pick/methodology.yaml" = "fifth_pick/data/config/methodology.yaml"
"final-project/config/fifth-pick/trust-tiers.yaml" = "fifth_pick/data/config/trust-tiers.yaml"
"final-project/config/fifth-pick/official-slates/2026-11-19.json" = "fifth_pick/data/config/official-slates/2026-11-19.json"
"final-project/config/fifth-pick/official-slates/2026-11-21.json" = "fifth_pick/data/config/official-slates/2026-11-21.json"
"final-project/config/fifth-pick/official-slates/2026-11-22.json" = "fifth_pick/data/config/official-slates/2026-11-22.json"

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "final-project/src", "final-project"]
extend-exclude = [
  "multi-tool-exercise",
  "evolution-00/**",
  "evolution-01/**",
  "evolution-02/**",
  "evolution-03/**",
  "evolution-04/**",
  "evolution-05/**",
  "evolution-06/**",
  "evolution-07/**",
  "evolution-08/**",
  "src/e6_context",
  "src/e7_memory",
  "src/grad_mcp",
  "tests/test_e4_mcp.py",
  "tests/test_e6_context.py",
  "tests/test_e7_isolation.py",
  "tests/test_e7_memory.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
extra-paths = ["final-project"]

[tool.ty.src]
exclude = [
  "multi-tool-exercise/**",
  "evolution-00/**",
  "evolution-01/**",
  "evolution-02/**",
  "evolution-03/**",
  "evolution-04/**",
  "evolution-05/**",
  "evolution-06/**",
  "evolution-07/**",
  "evolution-08/**",
  "src/e6_context",
  "src/e7_memory",
  "src/grad_mcp",
  "tests/test_e4_mcp.py",
  "tests/test_e6_context.py",
  "tests/test_e7_isolation.py",
  "tests/test_e7_memory.py",
]
